<!DOCTYPE html>
<html>
    <head>
         <title>A-Frame Primitives</title>
          <script src= "https://aframe.io/releases/1.8.0/aframe.min.js">
           </script>
           </head>
           <body> 
            <a-scene>
    <a-box
    color="black"
    position="0 0 -3"
    rotation="0 45 0"
    width="2"
    height="4"
    depth="6">
</a-box>
<a-sphere
color="orange"
position="0 3 -3 "
radius="1">
</a-sphere>
<a-cylinder
color="green"
position="0 3.5 -3"
rotation="0 45 0"
radius="0.2"
height="2.3">
</a-cylinder>
</a-scene>

        </body>
        </html>
